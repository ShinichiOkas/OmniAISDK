name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # extras のエンジンが入っていなければ失敗にする（tests/unit/test_extras_smoke.py）
      OMNI_REQUIRE_EXTRAS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,docs,mcp,local,search,audio]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest -m "not live"
      # Linux のランナーには Docker があるので、Sandbox の隔離を実物で確かめる
      - name: Live sandbox (Docker)
        if: runner.os == 'Linux'
        shell: bash
        env:
          OMNI_LIVE_DOCKER: "1"
        run: |
          set -o pipefail
          python -m pytest -m live tests/live/test_live_sandbox.py -rs | tee docker-live.txt
          # 実行されたことと結果を、認証なしで読める注釈に残す
          echo "::notice title=Live sandbox (Docker)::docker $(docker version --format '{{.Server.Version}}') / $(tail -n 1 docker-live.txt)"
